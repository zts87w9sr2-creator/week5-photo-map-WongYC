name: Import complete B16 website
on:
  push:
    branches: [main]
    paths: ['_b16_import/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b16-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and restore website
        shell: python
        run: |
          import hashlib, json, pathlib, tarfile, shutil
          root = pathlib.Path('_b16_import')
          manifest = json.loads((root / 'manifest.json').read_text())
          archive = pathlib.Path('/tmp/b16-site.tar.gz')
          digest = hashlib.sha256()
          with archive.open('wb') as output:
              for entry in manifest['chunks']:
                  chunk = root / entry['name']
                  data = chunk.read_bytes()
                  assert hashlib.sha256(data).hexdigest() == entry['sha256'], chunk
                  output.write(data)
                  digest.update(data)
          assert digest.hexdigest() == manifest['sha256'], 'Archive checksum mismatch'
          stage = pathlib.Path('/tmp/b16-site-restored')
          stage.mkdir()
          with tarfile.open(archive) as bundle:
              bundle.extractall(stage, filter='data')
          assert (stage / 'index.html').is_file()
          assert (stage / 'Hong_Kong_Memories.html').is_file()
          for child in stage.iterdir():
              if child.is_dir():
                  shutil.copytree(child, pathlib.Path(child.name), dirs_exist_ok=True)
              else:
                  shutil.copy2(child, pathlib.Path(child.name))
          shutil.rmtree(root)
      - name: Commit complete static site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html stories.html Hong_Kong_Memories.html css js data images tiles b16-update .nojekyll _b16_import
          git commit -m 'Publish complete B16 map, stories and Hong Kong memories'
          git push origin HEAD:main
